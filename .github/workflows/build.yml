name: Build PenguinOS Image & ISO

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  IMAGE_NAME: penguinos

jobs:
  build-container:
    name: Build & Push Container Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [dns]
              nameservers=["1.1.1.1", "8.8.8.8"]

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: meta
        run: |
          echo "image_tag=ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest" >> "$GITHUB_OUTPUT"

      - name: Build and Push Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Containerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.image_tag }}

  build-iso:
    name: Build Bootable ISO Installer
    needs: build-container
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Maximize build space on runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true

      - name: Create output directory
        run: mkdir -p output

      - name: Log in to GHCR via Podman
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull PenguinOS Container Image
        run: |
          sudo podman pull ${{ needs.build-container.outputs.image_tag }}

      - name: Build Bootable ISO with bootc-image-builder
        run: |
          sudo podman run \
            --rm \
            --privileged \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v "$PWD/config.toml:/config.toml:ro" \
            -v "$PWD/output:/output" \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type anaconda-iso \
            --rootfs btrfs \
            --config /config.toml \
            ${{ needs.build-container.outputs.image_tag }}

      - name: Prepare ISO, Split Chunks, and Generate SHA256 Checksums
        run: |
          sudo chown -R $USER:$USER output/
          cd output/bootiso
          sha256sum install.iso > PenguinOS-1.0-alpha.iso.sha256
          # GitHub Releases strictly limits individual assets to 2 GiB (2147483648 bytes).
          # Split into 1900MB parts so each chunk is safely under GitHub's limit.
          split -b 1900M -d --additional-suffix=.part install.iso PenguinOS-1.0-alpha.iso.
          sha256sum PenguinOS-1.0-alpha.iso.*.part >> PenguinOS-1.0-alpha.iso.sha256

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PenguinOS-installer-iso
          path: output/bootiso/install.iso
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Single Uncut ISO to Hugging Face
        if: env.HF_TOKEN != ''
        run: |
          pip install --upgrade huggingface_hub
          huggingface-cli upload linuxhasan/penguinos output/bootiso/install.iso PenguinOS-1.0-alpha.iso --repo-type dataset
          huggingface-cli upload linuxhasan/penguinos output/bootiso/PenguinOS-1.0-alpha.iso.sha256 PenguinOS-1.0-alpha.iso.sha256 --repo-type dataset
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0-alpha"
          name: "PenguinOS 1.0-alpha"
          draft: false
          prerelease: true
          make_latest: true
          body: |
            ## PenguinOS 1.0-alpha Bootable Installer
            
            ### 🚀 Direct High-Speed Download (Single Uncut ISO):
            👉 **[Download PenguinOS-1.0-alpha.iso from Hugging Face](https://huggingface.co/datasets/linuxhasan/penguinos/resolve/main/PenguinOS-1.0-alpha.iso)**
            
            ---
            
            ### Alternative: Download from GitHub Release (Split Parts):
            Due to GitHub Release's 2 GiB per-file limit, the assets attached below are provided in parts.
            
            **How to reassemble on Linux / macOS:**
            ```bash
            cat PenguinOS-1.0-alpha.iso.*.part > PenguinOS-1.0-alpha.iso
            sha256sum -c PenguinOS-1.0-alpha.iso.sha256
            ```
            
            **How to reassemble on Windows (Command Prompt):**
            ```cmd
            copy /b PenguinOS-1.0-alpha.iso.00.part + PenguinOS-1.0-alpha.iso.01.part PenguinOS-1.0-alpha.iso
            ```
          files: |
            output/bootiso/PenguinOS-1.0-alpha.iso.*.part
            output/bootiso/PenguinOS-1.0-alpha.iso.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
