name: Build PenguinOS Image & ISO

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  IMAGE_NAME: penguinos

jobs:
  build-container:
    name: Build & Push Container Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [dns]
              nameservers=["1.1.1.1", "8.8.8.8"]

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: meta
        run: |
          echo "image_tag=ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest" >> "$GITHUB_OUTPUT"

      - name: Build and Push Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Containerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.image_tag }}

  build-iso:
    name: Build Bootable ISO Installer
    needs: build-container
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Maximize build space on runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true

      - name: Create output directory
        run: mkdir -p output

      - name: Log in to GHCR via Podman
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull PenguinOS Container Image
        run: |
          sudo podman pull ${{ needs.build-container.outputs.image_tag }}

      - name: Build Bootable ISO with bootc-image-builder
        run: |
          sudo podman run \
            --rm \
            --privileged \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v "$PWD/config.toml:/config.toml:ro" \
            -v "$PWD/output:/output" \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type anaconda-iso \
            --rootfs btrfs \
            --config /config.toml \
            ${{ needs.build-container.outputs.image_tag }}

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PenguinOS-installer-iso
          path: output/bootiso/install.iso
          if-no-files-found: warn
          retention-days: 7
